<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>JS Game</title>
  </head>

  <body>
    <div class="container">
      <div class="container__conteudo">
        <div class="container__informacoes">
          <div class="container__texto">
            <div class="texto__linha">
              <h1></h1>
              <button
                id="btn-speak-h1"
                class="botao__fala"
                type="button"
                title="Ouvir título"
                aria-label="Ouvir título"
                disabled
              >
                🔊
              </button>
            </div>
            <div class="texto__linha">
              <p class="texto__paragrafo"></p>
              <button
                id="btn-speak-p"
                class="botao__fala"
                type="button"
                title="Ouvir parágrafo"
                aria-label="Ouvir parágrafo"
                disabled
              >
                🔊
              </button>
            </div>
          </div>
          <input type="number" min="1" max="10" class="container__input" />
          <div class="chute container__botoes">
            <button
              onclick="verificarNumero()"
              id="chutar"
              class="container__botao"
            >
              Chutar
            </button>
            <button
              onclick="btReiniciar()"
              id="reiniciar"
              class="container__botao"
              disabled
            >
              Novo jogo
            </button>
          </div>
        </div>
        <img
          src="./img/ia.png"
          alt="Uma pessoa olhando para a esquerda"
          class="container__imagem-pessoa"
        />
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
